name: Backend CI (Spring Boot 3)

on:
  push:
    branches: [ "main" ]
  pull-request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
      
    - name: Dar permissão de execução ao Maven Wrapper
      run: chmod +x mvnw
    
    - name: Build e Testes (Maven)
      run: ./mvnw clean package -B
    
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: analisador-api-jar
        path: target/*.jar